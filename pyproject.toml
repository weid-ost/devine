[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devine-torch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Florian Hammer", email = "florian.hammer@ost.ch" }, { name = "Nora Helbig", email = "nora.helbig@ost.ch"}]
dependencies = [
  "click>=8.1.7",
  "loguru>=0.7.3",
  "tomli-w>=1.1.0",
  "diskcache>=5.6.3",
  "pydantic-settings>=2.7.1",
  "numpy>=2.2.0",
  "scipy>=1.15.1",
  "matplotlib>=3.10.0",
  "pydantic>=2.10.3",
  "xarray==2025.1.2",
  "h5netcdf==1.6.1",
  "netcdf4==1.7.2",
  "joblib>=1.4.2",
  "torchinfo>=1.8.0",
  "torch>=2.9.0",
  "torchvision>=0.24.0",
  "lightning>=2.5.5",
]
description = "Devine PyTorch Implementation"
license = { file = "LICENSE" }
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "myst-parser>=4.0.0",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.1.3",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
lint.ignore = ["E501"]
lint.select = ["E", "F", "I", "W"]
lint.fixable = ["I"]
line-length = 79
exclude = [".env", ".venv", "venv", "notebooks"]

[tool.black]
line-length = 79
extend-exclude = '''
/(
  | .env
  | .venv
  | venv
  | notebooks
)/
'''

[tool.hatch.version]
path = "devine_torch/__about__.py"

[tool.hatch.envs.default.scripts]
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=devine_torch --cov=tests {args}"
no-cov = "cov --no-cov {args}"

[tool.coverage.run]
branch = true
parallel = true

[dependency-groups]
dev = [
    "aim>=3.29.1",
    "aim-mlflow>=0.2.1",
    "basedpyright>=1.36.1",
    "black>=25.1.0",
    "dvc>=3.60.1",
    "hatch>=1.14.1",
    "mlflow>=3.1.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.2",
]

[project.scripts]
devine = "devine_torch.cli:cli"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
only-include = ["devine_torch", "models"]

[tool.hatch.build.targets.sdist.sources]
"models" = "devine_torch/build_models"

[tool.hatch.build.targets.wheel]
only-include = ["devine_torch", "models"]

[tool.hatch.build.targets.wheel.sources]
"models" = "devine_torch/build_models"
